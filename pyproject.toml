[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "research-assistant-maf"
version = "0.1.0"
description = "Microsoft Agent Framework workflows for evidence-bound research teams"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
dependencies = ["agent-framework-core==1.19.0"]

[project.optional-dependencies]
codex = ["openai-codex==0.159.3"]

[project.scripts]
research-assistant = "research_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_assistant = ["resources/roles/*.md", "resources/skills/**/*.md", "resources/skills/**/*.json"]
